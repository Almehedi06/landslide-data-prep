[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "landslide-data-prep"
version = "0.1.0"
description = "AOI-based geospatial preprocessing and Landlab-ready raster export."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
geo = [
  "rasterio>=1.3",
  "fiona>=1.9",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.6",
  "landlab>=2.8",
  "bmi-topography>=0.5",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
soil-fetch = "soil_data.cli_fetch:main"
soil-harmonize = "soil_data.cli_harmonize:main"
soil-run = "soil_data.cli_run:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "climate_features",
  "clip_rasters_to_fire",
  "dem",
  "dem_difference",
  "downloads",
  "export_ascii_to_tif",
  "landlab_io",
  "load_fire_perimeter",
  "pipeline",
  "preflight",
  "reproject_and_resample",
  "run_pipeline",
  "soil_features",
  "topo_derivatives",
  "vegetation_features",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["soil_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
